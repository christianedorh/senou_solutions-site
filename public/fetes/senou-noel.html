<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENOU Solutions · Joyeuses fêtes</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<!--
  Spot de marque SENOU Solutions, édition fêtes de fin d'année.
  Boucle de 6 s, CSS pur (transform + opacity), neige sur canvas, son synthétisé (Web Audio).
  Fichier autonome : à ouvrir directement (/fetes/senou-noel.html) ou à intégrer en iframe.
  Paramètres d'URL :
    ?lang=en    textes en anglais
    ?nosound    masque le bouton du son
-->
<style>
  :root {
    color-scheme: dark;
    --cyan: #1fb5f0;
    --blue: #1f6fe0;
    --mist: #cfe3fb;
    --gold: #f2b441;
    --night: #06122b;
    --night-2: #0a1b3d;
    --night-3: #0f2a5c;
    --snow: 234, 242, 252;
    --cycle: 6s;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    overflow: hidden;
    background: var(--night);
    font-family: "Outfit", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Scène : remplit la fenêtre ou l'iframe ---------- */
  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    container-type: size;
    overflow: hidden;
    isolation: isolate;
    background:
      radial-gradient(90% 70% at 50% 108%, rgba(207, 227, 251, 0.16) 0%, rgba(207, 227, 251, 0) 60%),
      radial-gradient(70% 60% at 50% 42%, var(--night-3) 0%, rgba(15, 42, 92, 0) 70%),
      linear-gradient(180deg, var(--night) 0%, var(--night-2) 100%);
  }

  /* Halo doré, lent, hors du cycle */
  .glow {
    position: absolute;
    left: 50%;
    top: 46%;
    width: 120cqmin;
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(242, 180, 65, 0.13) 0%, rgba(242, 180, 65, 0) 62%);
    transform: translate(-50%, -50%);
    animation: breathe 9s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
    z-index: 0;
  }

  @keyframes breathe {
    from { transform: translate(-50%, -50%) scale(0.92); opacity: 0.7; }
    to   { transform: translate(-50%, -50%) scale(1.06); opacity: 1; }
  }

  #snow {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  /* Étoiles scintillantes, positions fixes */
  .stars { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

  .star {
    position: absolute;
    width: var(--s, 1.4cqmin);
    aspect-ratio: 1;
    opacity: 0.25;
    animation: twinkle var(--d, 3.2s) ease-in-out var(--w, 0s) infinite alternate;
  }

  .star::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--c, var(--mist));
    clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%);
  }

  @keyframes twinkle {
    from { opacity: 0.18; transform: scale(0.7) rotate(0deg); }
    to   { opacity: 0.9;  transform: scale(1) rotate(12deg); }
  }

  /* ---------- Lockup ---------- */
  .lockup {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3.6cqmin;
    padding: 6cqmin;
  }

  .logo {
    display: block;
    width: min(64cqw, 150cqh);
    height: auto;
    overflow: visible;
    filter: drop-shadow(0 0 3cqmin rgba(31, 181, 240, 0.18));
  }

  #brand-icon, #brand-word {
    transform-box: fill-box;
    will-change: transform, opacity;
    opacity: 0;
  }

  #brand-icon {
    transform-origin: center;
    animation: icon-cycle var(--cycle) linear infinite both;
  }

  #brand-word {
    transform-origin: left center;
    animation: word-cycle var(--cycle) linear infinite both;
  }

  .rule {
    width: 14cqmin;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--cyan), var(--gold));
    transform-origin: center;
    opacity: 0;
    animation: rule-cycle var(--cycle) linear infinite both;
  }

  .tagline {
    margin: 0;
    font-weight: 300;
    font-size: clamp(13px, 4.4cqmin, 38px);
    line-height: 1.1;
    letter-spacing: 0.15em;
    text-indent: 0.15em;
    color: #eaf0fa;
    text-align: center;
    opacity: 0;
    animation: tag-cycle var(--cycle) linear infinite both;
  }

  .tagline em { font-style: normal; color: var(--cyan); }

  .greet {
    display: inline-flex;
    align-items: center;
    gap: 1.6cqmin;
    margin: 0.8cqmin 0 0;
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 500;
    font-size: clamp(11px, 2.6cqmin, 20px);
    letter-spacing: 0.32em;
    text-indent: 0.32em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0;
    animation: greet-cycle var(--cycle) linear infinite both;
  }

  .greet::before, .greet::after {
    content: "";
    width: 1.3em;
    aspect-ratio: 1;
    background: currentColor;
    clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%);
    animation: spark-cycle var(--cycle) linear infinite both;
  }

  /* ---------- Cycle de 6 000 ms (1 % = 60 ms), 0 % === 100 % ---------- */

  /* « S » : 100 → 1 000 ms, léger dépassement */
  @keyframes icon-cycle {
    0%     { opacity: 0; transform: translate3d(0, 4%, 0) scale(0.82); }
    1.7%   { opacity: 0; transform: translate3d(0, 4%, 0) scale(0.82); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
    16.7%, 88.3% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
    96.3%, 100%  { opacity: 0; transform: translate3d(0, -2%, 0) scale(0.97); }
  }

  /* Nom : 550 → 1 350 ms */
  @keyframes word-cycle {
    0%     { opacity: 0; transform: translate3d(-2.4%, 0, 0) scale(0.985); }
    9.2%   { opacity: 0; transform: translate3d(-2.4%, 0, 0) scale(0.985); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
    22.5%, 88.3% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
    96.3%, 100%  { opacity: 0; transform: translate3d(0, -2%, 0) scale(0.97); }
  }

  /* Filet cyan → or : 1 100 → 1 800 ms */
  @keyframes rule-cycle {
    0%     { opacity: 0; transform: scale3d(0, 1, 1); }
    18.3%  { opacity: 0; transform: scale3d(0, 1, 1); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
    30%, 88.3%   { opacity: 1; transform: scale3d(1, 1, 1); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
    96.3%, 100%  { opacity: 0; transform: scale3d(1, 1, 1); }
  }

  /* Signature : 1 250 → 1 900 ms */
  @keyframes tag-cycle {
    0%     { opacity: 0; transform: translate3d(0, 60%, 0); }
    20.8%  { opacity: 0; transform: translate3d(0, 60%, 0); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
    31.7%, 88.3% { opacity: 1; transform: translate3d(0, 0, 0); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
    96.3%, 100%  { opacity: 0; transform: translate3d(0, -20%, 0); }
  }

  /* Vœux : 2 100 → 2 900 ms */
  @keyframes greet-cycle {
    0%     { opacity: 0; transform: translate3d(0, 40%, 0); letter-spacing: 0.5em; }
    35%    { opacity: 0; transform: translate3d(0, 40%, 0); letter-spacing: 0.5em; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
    48.3%, 88.3% { opacity: 1; transform: translate3d(0, 0, 0); letter-spacing: 0.32em; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
    96.3%, 100%  { opacity: 0; transform: translate3d(0, -20%, 0); letter-spacing: 0.32em; }
  }

  /* Étincelles de part et d'autre des vœux : 2 200 → 2 700 ms, puis scintillement */
  @keyframes spark-cycle {
    0%, 36.7% { transform: scale(0) rotate(-90deg); }
    45%   { transform: scale(1.35) rotate(0deg); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
    50%   { transform: scale(1) rotate(0deg); }
    65%   { transform: scale(0.8) rotate(20deg); }
    80%   { transform: scale(1) rotate(0deg); }
    88.3% { transform: scale(1) rotate(0deg); }
    96.3%, 100% { transform: scale(0) rotate(45deg); }
  }

  /* ---------- Bouton du son ---------- */
  .sound {
    position: absolute;
    top: clamp(10px, 2.4cqmin, 20px);
    right: clamp(10px, 2.4cqmin, 20px);
    z-index: 5;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin: 0;
    padding: 7px 11px 7px 9px;
    appearance: none;
    border: 1px solid rgba(207, 227, 251, 0.2);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(10px) saturate(1.2);
    -webkit-backdrop-filter: blur(10px) saturate(1.2);
    color: var(--mist);
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px;
    line-height: 1;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.25s ease, border-color 0.25s ease, background-color 0.25s ease;
  }

  .sound:hover { color: #fff; border-color: rgba(242, 180, 65, 0.45); background: rgba(255, 255, 255, 0.12); }
  .sound:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .sound[aria-pressed="true"] { color: var(--gold); border-color: rgba(242, 180, 65, 0.5); background: rgba(242, 180, 65, 0.12); }
  .sound b { font-weight: 500; }
  .sound svg { width: 15px; height: 15px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .sound .wave, .sound .mute { transition: opacity 0.2s ease; }
  .sound .wave { opacity: 0; }
  .sound .mute { opacity: 0.75; }
  .sound[aria-pressed="true"] .wave { opacity: 1; }
  .sound[aria-pressed="true"] .mute { opacity: 0; }
  .sound[hidden] { display: none; }

  @container (max-width: 430px) {
    .sound b { display: none; }
    .sound { padding: 7px; gap: 0; }
  }

  /* ---------- Mouvement réduit : image fixe, tout visible ---------- */
  @media (prefers-reduced-motion: reduce) {
    .glow, .star, #brand-icon, #brand-word, .rule, .tagline, .greet, .greet::before, .greet::after {
      animation: none !important;
    }
    #brand-icon, #brand-word, .rule, .tagline, .greet { opacity: 1; transform: none; }
    .star { opacity: 0.6; }
    .sound { transition: none; }
  }
</style>
</head>

/* ---------- Neige : trois profondeurs, dérive latérale, hors du cycle ---------- */
(function () {
  "use strict";
  var canvas = document.getElementById("snow");
  var ctx = canvas.getContext("2d");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var flakes = [], w = 0, h = 0, dpr = 1, last = 0;

  function seed(rand) { return { x: Math.random() * w, y: rand ? Math.random() * h : -10, z: 0.35 + Math.random() * 0.65, p: Math.random() * Math.PI * 2 }; }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = canvas.clientWidth; h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var n = Math.min(180, Math.round((w * h) / 7000));
    while (flakes.length < n) flakes.push(seed(true));
    flakes.length = n;
    if (reduced) draw(0);
  }

  function draw(dt) {
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      if (dt) {
        f.p += dt * (0.6 + f.z * 0.6);
        f.y += dt * (14 + 46 * f.z);
        f.x += dt * Math.sin(f.p) * 10 * f.z;
        if (f.y > h + 6) { flakes[i] = seed(false); continue; }
        if (f.x < -6) f.x = w + 6; else if (f.x > w + 6) f.x = -6;
      }
      var r = 0.6 + f.z * 2.1;
      ctx.beginPath();
      ctx.fillStyle = "rgba(234, 242, 252, " + (0.25 + f.z * 0.6).toFixed(3) + ")";
      ctx.arc(f.x, f.y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function frame(t) {
    var dt = last ? Math.min((t - last) / 1000, 0.05) : 0;
    last = t;
    draw(dt);
    requestAnimationFrame(frame);
  }

  new ResizeObserver(resize).observe(canvas);
  resize();
  if (!reduced) requestAnimationFrame(frame);
})();

/* ---------------------------------------------------------------------------
   Son — entièrement synthétisé (Web Audio), aucun fichier.
   Calage sur le cycle de 6 000 ms :
     0,10 s  « S » qui entre      → souffle
     0,57 s  le « S » se pose     → appui grave + La♭4
     1,00 s  le nom glisse        → Do5
     1,10 s  le filet se trace    → balayage discret
     1,35 s  le nom en place      → Mi♭5
     1,42 s  la signature monte   → accord La♭ add9
     2,10 s  « Joyeuses fêtes »   → grelots + arpège de célesta
     5,30 s  fondu visuel         → fondu sonore
--------------------------------------------------------------------------- */
(function () {
  "use strict";

  var CYCLE = 6, LOOKAHEAD = 1.2, LEVEL = 0.8, FADE_IN = 5.30, FADE_OUT = 5.78;
  var T = window.SENOU_T;
  var btn = document.getElementById("sound");
  var label = btn.querySelector("b");

  var ctx = null, mix = null, master = null, shaper = null, verb = null, noiseBuf = null;
  var on = false, timer = null, nextStart = 0, refAnim = null, live = [];

  function makeNoise(seconds) {
    var rate = ctx.sampleRate, len = Math.floor(rate * seconds);
    var buf = ctx.createBuffer(1, len, rate), d = buf.getChannelData(0), last = 0, i, v;
    for (i = 0; i < len; i++) {
      last = last * 0.86 + (Math.random() * 2 - 1) * 0.14;
      v = last * 3.1;
      d[i] = v > 1 ? 1 : (v < -1 ? -1 : v);
    }
    return buf;
  }

  function makeImpulse(seconds, decay) {
    var rate = ctx.sampleRate, len = Math.floor(rate * seconds);
    var buf = ctx.createBuffer(2, len, rate), c, i, d, lp, t;
    for (c = 0; c < 2; c++) {
      d = buf.getChannelData(c); lp = 0;
      for (i = 0; i < len; i++) {
        t = i / len;
        lp = lp * 0.52 + (Math.random() * 2 - 1) * 0.48;
        d[i] = lp * Math.pow(1 - t, decay) * (1 - Math.exp(-i / (rate * 0.005)));
      }
    }
    return buf;
  }

  function softCurve() {
    var n = 2048, c = new Float32Array(n), i, x;
    for (i = 0; i < n; i++) { x = (i / (n - 1)) * 2 - 1; c[i] = Math.tanh(x * 1.3) / 1.3; }
    return c;
  }

  function build() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();
    shaper = ctx.createWaveShaper(); shaper.curve = softCurve(); shaper.oversample = "2x";
    master = ctx.createGain(); master.gain.value = 0.0001;
    mix = ctx.createGain(); mix.gain.value = 0.0001;
    mix.connect(master); master.connect(shaper); shaper.connect(ctx.destination);

    verb = ctx.createConvolver(); verb.normalize = true; verb.buffer = makeImpulse(2.8, 2.3);
    var hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 220;
    var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 4200;
    var ret = ctx.createGain(); ret.gain.value = 0.9;
    verb.connect(hp); hp.connect(lp); lp.connect(ret); ret.connect(mix);

    noiseBuf = makeNoise(2.5);
    return true;
  }

  function out(node, bus, wetAmt) {
    node.connect(bus.dry);
    if (wetAmt > 0) { var s = ctx.createGain(); s.gain.value = wetAmt; node.connect(s); s.connect(bus.wet); }
  }

  function bell(bus, t, freq, amp, dur, wet, bright) {
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(amp, t + 0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = 0.4;
    lp.frequency.setValueAtTime(Math.min(freq * 8, 15000), t);
    lp.frequency.exponentialRampToValueAtTime(Math.max(freq * 2.2, 420), t + dur * 0.7);
    g.connect(lp); out(lp, bus, wet);
    [[1, 1, 0], [1, 0.22, -7], [2, 0.2 * bright, 0], [3.01, 0.075 * bright, 0], [4.02, 0.025 * bright, 0]].forEach(function (p) {
      var o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = freq * p[0]; o.detune.value = p[2];
      var pg = ctx.createGain(); pg.gain.value = p[1];
      o.connect(pg); pg.connect(g); o.start(t); o.stop(t + dur + 0.1);
    });
    var tri = ctx.createOscillator(); tri.type = "triangle"; tri.frequency.value = freq;
    var tg = ctx.createGain(); tg.gain.value = 0.12;
    tri.connect(tg); tg.connect(g); tri.start(t); tri.stop(t + dur + 0.1);
  }

  // Célesta : partiels purs, attaque nette, déclin court et brillant.
  function celesta(bus, t, freq, amp, dur, wet) {
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(amp, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    out(g, bus, wet);
    [[1, 1], [4, 0.18], [10.1, 0.04]].forEach(function (p) {
      var o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = freq * p[0];
      var pg = ctx.createGain(); pg.gain.value = p[1];
      o.connect(pg); pg.connect(g); o.start(t); o.stop(t + dur + 0.05);
    });
  }

  // Grelot : bruit en bande étroite très aiguë + deux partiels métalliques.
  function jingle(bus, t, amp) {
    var src = ctx.createBufferSource(); src.buffer = noiseBuf; src.playbackRate.value = 1.6;
    var bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 3.5; bp.frequency.value = 7200;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(amp, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    src.connect(bp); bp.connect(g); out(g, bus, 0.35);
    src.start(t, Math.random() * 1.5); src.stop(t + 0.2);
    [3170, 4690].forEach(function (f, k) {
      var o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = f * (0.99 + Math.random() * 0.02);
      var og = ctx.createGain();
      og.gain.setValueAtTime(0.0001, t);
      og.gain.exponentialRampToValueAtTime(amp * (k ? 0.18 : 0.28), t + 0.003);
      og.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
      o.connect(og); out(og, bus, 0.3); o.start(t); o.stop(t + 0.15);
    });

  function pad(bus, t, freq, amp, attack, dur, wet) {
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(amp, t + attack);
    g.gain.setValueAtTime(amp, t + attack + 0.3);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = 0.3; lp.frequency.value = Math.min(freq * 6, 14000);
    g.connect(lp); out(lp, bus, wet);
    [[1, 1, 0], [1, 0.5, 6], [2, 0.12, 0], [3, 0.04, 0]].forEach(function (p) {
      var o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = freq * p[0]; o.detune.value = p[2];
      var pg = ctx.createGain(); pg.gain.value = p[1];
      o.connect(pg); pg.connect(g); o.start(t); o.stop(t + dur + 0.15);
    });

  function swell(bus, t, dur, amp) {
    var src = ctx.createBufferSource(); src.buffer = noiseBuf;
    var hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 150;
    var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = 0.9;
    lp.frequency.setValueAtTime(240, t);
    lp.frequency.exponentialRampToValueAtTime(2300, t + dur * 0.55);
    lp.frequency.exponentialRampToValueAtTime(600, t + dur);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(amp, t + dur * 0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(hp); hp.connect(lp); lp.connect(g); out(g, bus, 0.5);
    src.start(t, 0.1); src.stop(t + dur + 0.05);
  }

  function thump(bus, t, freq, amp, dur) {
    var o = ctx.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(freq * 1.5, t);
    o.frequency.exponentialRampToValueAtTime(freq, t + 0.09);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(amp, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); out(g, bus, 0.25); o.start(t); o.stop(t + dur + 0.05);
  }

  function sweep(bus, t, dur, amp) {
    var src = ctx.createBufferSource(); src.buffer = noiseBuf; src.playbackRate.value = 1.2;
    var bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 6;
    bp.frequency.setValueAtTime(1300, t);
    bp.frequency.exponentialRampToValueAtTime(4200, t + dur);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(amp, t + dur * 0.3);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp); bp.connect(g); out(g, bus, 0.7);
    src.start(t, 0.6); src.stop(t + dur + 0.05);
  }

    var bus = { dry: ctx.createGain(), wet: ctx.createGain() };

    live.push({ bus: bus, end: t0 + CYCLE + 0.8 });

    var m = mix.gain;
    m.cancelScheduledValues(t0);
    m.setValueAtTime(0.0001, t0);
    m.linearRampToValueAtTime(1, t0 + 0.03);
    m.setValueAtTime(1, t0 + FADE_IN);
    m.linearRampToValueAtTime(0.0001, t0 + FADE_OUT);

    swell(bus, t0 + 0.10, 0.62, 0.075);
    thump(bus, t0 + 0.56, 103.83, 0.075, 0.55);
    bell(bus, t0 + 0.58, 415.30, 0.085, 1.5, 0.45, 0.8);
    bell(bus, t0 + 1.00, 523.25, 0.070, 1.4, 0.50, 0.9);
    sweep(bus, t0 + 1.10, 0.30, 0.022);
    bell(bus, t0 + 1.35, 622.25, 0.062, 1.6, 0.55, 1.0);

    var chord = [103.83, 207.65, 311.13, 415.30, 523.25], amps = [0.055, 0.045, 0.034, 0.030, 0.024], i;
    for (i = 0; i < chord.length; i++) pad(bus, t0 + 1.42, chord[i], amps[i], 0.34, 3.4, 0.4);

    for (i = 0; i < arp.length; i++) celesta(bus, t0 + 2.14 + i * 0.13, arp[i], 0.05 - i * 0.006, 1.4, 0.7);

    var anims = cycleAnims();
    anims.forEach(function (a) { try { a.currentTime = 0; a.play(); } catch (e) {} });

      try { l.bus.dry.disconnect(); l.bus.wet.disconnect(); } catch (e) {}

    });

  function killLive() {
    live.forEach(function (l) {
      try { l.bus.dry.gain.value = 0; l.bus.wet.gain.value = 0; l.bus.dry.disconnect(); l.bus.wet.disconnect(); } catch (e) {}

    if (refAnim && typeof refAnim.currentTime === "number") {
      var vp = ((refAnim.currentTime / 1000) % CYCLE + CYCLE) % CYCLE;
      var d = (((vp + (nextStart - now)) % CYCLE) + CYCLE) % CYCLE;
      if (d > CYCLE / 2) d -= CYCLE;
      if (Math.abs(d) > 0.4) nextStart = now + ((CYCLE - vp) % CYCLE);
      else if (Math.abs(d) > 0.02) nextStart -= Math.max(-0.12, Math.min(0.12, d));
    }
    while (nextStart - ctx.currentTime < LOOKAHEAD) {
      var t = Math.max(nextStart, ctx.currentTime + 0.02);
      scheduleCycle(t);
      nextStart = t + CYCLE;
    }
  }

  function start() {
    on = true;
    killLive();
    refAnim = null;
    restartVisual().forEach(function (a) { if (a.animationName === "icon-cycle") refAnim = a; });
    var now = ctx.currentTime;
    master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(0.0001, now);
    master.gain.linearRampToValueAtTime(LEVEL, now + 0.08);
    nextStart = now + 0.07;
    scheduleCycle(nextStart);
    nextStart += CYCLE;
    if (timer) clearInterval(timer);
    timer = setInterval(tick, 220);
    btn.setAttribute("aria-pressed", "true");
    btn.title = T.off; label.textContent = T.off;
  }

  function stop() {
    on = false;
    if (timer) { clearInterval(timer); timer = null; }
    if (ctx) {
      var now = ctx.currentTime, g = master.gain;
      g.cancelScheduledValues(now);
      g.setValueAtTime(Math.max(g.value, 0.0001), now);
      g.linearRampToValueAtTime(0.0001, now + 0.22);
      setTimeout(function () { if (!on) killLive(); }, 320);
    }
    btn.setAttribute("aria-pressed", "false");
    btn.title = T.on; label.textContent = T.on;
  }

  btn.addEventListener("click", function () {
    if (on) { stop(); return; }
    if (!ctx && !build()) { btn.disabled = true; label.textContent = T.na; return; }
    var p = ctx.resume ? ctx.resume() : null;
    if (p && p.then) p.then(start, start); else start();
  });

  document.addEventListener("visibilitychange", function () { if (!document.hidden && on) tick(); });
})();
</script>
